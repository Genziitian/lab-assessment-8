apiVersion: apps/v1
kind: Deployment
metadata:
  name: noticeboard-deployment
  labels:
    app: noticeboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: noticeboard
  template:
    metadata:
      labels:
        app: noticeboard
    spec:
      containers:
      - name: noticeboard-container
        # Updated with your actual Docker Hub username
        image: sriram1108/noticeboard:latest
        ports:
        - containerPort: 80
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: noticeboard-service
spec:
  type: NodePort
  selector:
    app: noticeboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
